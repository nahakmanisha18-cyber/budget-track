<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Budget Track</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="app-container">
            <header class="header">
                <div>
                    <h1>Budget App</h1>
                    <p>Manage your money easily</p>
                </div>
            </header>

            <section class="summary-grid">
                <div class="summary-card balance-card">

                    <div>
                        <p>Total Budget</p>
                        <h2 id="budget">₹0</h2>
                    </div>
                </div>

                <div class="summary-card income-card">

                    <div>
                        <p>Total Expense</p>
                        <h2 id="expense">₹0</h2>
                    </div>
                </div>
                <div class="summary-card expense-card">
                   
                    <div>
                        <p>Budget left</p>
                        <h2 id="budgetLeft">₹0</h2>
                    </div>
                </div>

            </section>

            <main class="main-grid">
                <section class="card">
                    <form id="ExpenseForm">
                        <div class="top">
                            <div class="section-title">
                                <div>
                                    <h2>Add Budget</h2>
                                </div>

                            </div>
                            <div class="form-group">
                                <label for="Budget">
                                    Budget:
                                </label>

                                <input type="text" id="Budget" placeholder="e.g. Budget" >
                            </div>

                            <button type="submit" class="add-btn">
                                Add Budget
                            </button>

                        </div>




                        <div class="bottom">
                            <div class="section-title">
                                <div>
                                    <h2>Add Expense</h2>
                                </div>


                            </div>

                            <div class="form-group">
                                <label for="category">
                                    Category
                                </label>

                                <select id="category">

                                    <option value="Salary">
                                        Select
                                    </option>

                                    <option value="Food">
                                        Food
                                    </option>

                                    <option value="Shopping">
                                        Shopping
                                    </option>

                                    <option value="Travel">
                                        Travel
                                    </option>

                                    <option value="Bills">
                                        Bills
                                    </option>

                                    <option value="Entertainment">
                                        Entertainment
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>
                            </div>

                            <div class="form-group">
                                <label for="amount">
                                    Amount:
                                </label>

                                <input type="text" id="amount" placeholder=" Amount" >
                            </div>

                      
                            <div class="form-group">
                                <label for="date">
                                    Date
                                </label>
                                <input type="date" id="date" >
                            </div>


                            <button type="submit" class="add-btn">
                                Add Expense
                            </button>
                        </div>

                    </form>

                </section>


                <section class="card left-section">

                    <div class="section-title">

                        <div>
                            <h2>Transactions</h2>
                            <p>Your recent transactions</p>
                        </div>

                        <span class="transaction-count" id="transactionCount">
                            0
                        </span>

                    </div>

                    <div class="lines"></div>


                    <div class="transaction-list" id="transactionList">
                        <div class="empty-state">

                        

                            <h3>No transactions yet</h3>

                            <p>
                                Add your first income or expense
                                to get started.
                            </p>

                        </div>

                    </div>

                </section>

            </main>

        </div>


        <!-- JavaScript -->
        <script src="script.js">


        </script>

    </body>

</html>
